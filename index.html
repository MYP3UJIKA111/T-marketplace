            overflow-y: auto;
        }
        
        .tree {
            font-family: 'Fira Code', monospace;
            line-height: 1.6;
        }
        
        .folder {
            margin: 5px 0;
            cursor: pointer;
            user-select: none;
        }
        
        .folder::before {
            content: '📁 ';
            margin-right: 5px;
        }
        
        .file::before {
            content: '📄 ';
            margin-right: 5px;
        }
        
        .file.java::before { content: '☕ '; }
        .file.ts::before { content: '🔷 '; }
        .file.tsx::before { content: '⚛️ '; }
        .file.json::before { content: '📋 '; }
        .file.yml::before { content: '⚙️ '; }
        .file.md::before { content: '📖 '; }
        .file.sql::before { content: '🗃️ '; }
        .file.docker::before { content: '🐳 '; }
        .file.html::before { content: '🌐 '; }
        .file.css::before { content: '🎨 '; }
        
        .children {
            margin-left: 20px;
            display: none;
        }
        
        .expanded > .children {
            display: block;
        }
        
        .expanded::before {
            content: '📂 ';
        }
        
        .file {
            color: #666;
            padding: 2px 5px;
            border-radius: 3px;
            transition: all 0.2s;
        }
        
        .file:hover {

        function createTreeElement(item, path = '') {
            const currentPath = path ? `${path}/${item.name}` : item.name;
            const element = document.createElement('div');
            
            if (item.type === 'folder') {
                element.className = 'folder';
                element.innerHTML = `
                    <span>${item.name}</span>
                    <div class="children"></div>
                `;
                
                const childrenContainer = element.querySelector('.children');
                if (item.children) {
                    item.children.forEach(child => {
                        childrenContainer.appendChild(createTreeElement(child, currentPath));
                    });
                }
                
                element.addEventListener('click', (e) => {
                    e.stopPropagation();
                    element.classList.toggle('expanded');
                });
                
            } else {
                element.className = `file ${item.class || ''}`;
                element.textContent = item.name;
                element.title = currentPath;
            }
            
            return element;
        }

        // Initialize tree
        document.addEventListener('DOMContentLoaded', () => {
            const treeContainer = document.getElementById('projectTree');
            treeContainer.appendChild(createTreeElement(projectStructure));
            
            // Auto-expand first level
            setTimeout(() => {
                const rootFolders = treeContainer.querySelectorAll('.folder');
                rootFolders.forEach(folder => {
                    folder.classList.add('expanded');
                });
            }, 100);
        });
